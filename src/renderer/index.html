<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob: ds-icon:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self'">
<title>Hai Launchpad</title>
<link rel="stylesheet" href="styles.css">
</head>
<body data-theme="dark">
  <!-- 背景：桌面截屏 + 可调模糊 + 可调遮罩 -->
  <div id="bg" aria-hidden="true">
    <img id="wallpaper" alt="">
    <img id="wallpaper2" alt="">
    <div id="dim"></div>
    <div id="tint"></div>
    <div id="vignette"></div>
  </div>

  <main id="stage">
    <header id="topbar">
      <div id="searchwrap">
        <svg id="searchicon" viewBox="0 0 20 20" aria-hidden="true">
          <circle cx="8.6" cy="8.6" r="5.6" fill="none" stroke="currentColor" stroke-width="1.6"/>
          <path d="M12.9 12.9 L17 17" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
        <input id="search" type="text" placeholder="搜索" autocomplete="off" spellcheck="false" aria-label="搜索应用" data-i18n-ph="搜索" data-i18n-aria="搜索应用">
        <button id="searchclear" title="清空" data-i18n-title="清空" tabindex="-1">×</button>
      </div>
      <div id="topright">
        <button class="addbtn" id="btn-edit-icons" title="修改图标（添加 / 同步桌面 / 清空）" data-i18n-title="修改图标（添加 / 同步桌面 / 清空）">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 4.6v10.8M4.6 10h10.8" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg>
          <span data-i18n="修改图标">修改图标</span>
        </button>
        <button class="ghostbtn" id="btn-refresh" title="刷新应用（重新扫描桌面）" data-i18n-title="刷新应用（重新扫描桌面）">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M16 10a6 6 0 1 1-1.8-4.3M16 4v4h-4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button class="ghostbtn" id="btn-settings" title="设置" data-i18n-title="设置">
          <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="2.6" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M10 2.6v2.2M10 15.2v2.2M2.6 10h2.2M15.2 10h2.2M4.8 4.8l1.6 1.6M13.6 13.6l1.6 1.6M15.2 4.8l-1.6 1.6M6.4 13.6l-1.6 1.6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        </button>
      </div>
    </header>

    <div id="pagebar" hidden></div>

    <div id="grid-area">
      <div id="grid" role="grid" aria-label="应用" data-i18n-aria="应用"></div>
      <div id="empty" hidden data-i18n="没有找到应用">没有找到应用</div>
    </div>

    <footer id="bottom">
      <div id="dots" role="tablist" aria-label="页面" data-i18n-aria="页面"></div>
    </footer>
  </main>

  <div id="moremenu" class="ctxmenu" hidden></div>
  <div id="confirm-root" hidden></div>
  <div id="toast" hidden></div>
  <div id="modal-root" hidden></div>

  <script src="../shared/i18n.js"></script>
  <script src="i18n.js"></script>
  <script src="renderer.js"></script>
  <div id="folderview" hidden></div>
</body>
</html>
